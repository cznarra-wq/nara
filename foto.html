<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potret Kenangan — Selamat Ulang Tahun</title>
  <style>
    :root {
      --bg: #c44c7a;
      --card: #ffffff;
      --text: #000000;
      --muted: #000000;
      --accent: #69112e;
      --accent-hover: #c94666;
      --border: #f2dce2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 48px;
    }

    /* Navigasi / Menu */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 248, 245, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-brand {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      background-color: var(--accent);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn-back:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Header Halaman */
    .header {
      max-width: 960px;
      margin: 36px auto 24px;
      padding: 0 20px;
      text-align: center;
    }

    .header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      max-width: 560px;
      margin: 0 auto;
    }

    /* Grid Galeri Foto */
    .gallery {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .photo-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(45, 35, 46, 0.05);
      transition: transform 0.2s ease;
    }

    .photo-card:hover {
      transform: translateY(-4px);
    }

    .photo-frame {
      width: 100%;
      aspect-ratio: 4 / 5; /* Pas untuk foto potret */
      overflow: hidden;
      background: #f5eaee;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caption {
      padding: 12px 14px;
      font-size: 0.92rem;
      color: var(--text);
      text-align: center;
    }

    /* Menu Bawah Tambahan */
    .footer-nav {
      max-width: 960px;
      margin: 36px auto 0;
      padding: 0 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Menu Atas -->
  <nav class="navbar">
    <span class="nav-brand">🎂 Birthday Album</span>
    <a href="index.html" class="btn-back">← Kembali</a>
  </nav>

  <!-- Judul -->
  <header class="header">
    <h1>Foto</h1>
  </header>

  <!-- Daftar Foto -->
  <main class="gallery">
    <figure class="photo-card">
      <div class="photo-frame">
        <!-- Ganti src dengan path foto kamu, misalnya: foto/foto1.jpg -->
        <img src="foto/WhatsApp Image 2026-11-22 at 18.44.36.jpeg" alt="Potret kenangan 1" />
      </div>
      <figcaption class="caption">💖</figcaption>
    </figure>

    <figure class="photo-card">
      <div class="photo-frame">
        <img src="foto/WhatsApp Image 2026-11-22 at 18.44.37 (1).jpeg" alt="Potret kenangan 2" />
      </div>
      <figcaption class="caption">💖</figcaption>
    </figure>

    <figure class="photo-card">
      <div class="photo-frame">
        <img src="foto/WhatsApp Image 2026-11-22 at 18.44.37.jpeg" alt="Potret kenangan 3" />
      </div>
      <figcaption class="caption">💖</figcaption>
    </figure>
    <figure class="photo-card">
      <div class="photo-frame">
        <img src="foto/WhatsApp Image 2026-11-22 at 18.44.39 (1).jpeg" alt="Potret kenangan 3" />
      </div>
      <figcaption class="caption">💖</figcaption>
    </figure>
    <figure class="photo-card">
      <div class="photo-frame">
        <img src="foto/WhatsApp Image 2026-11-22 at 18.44.39.jpeg" alt="Potret kenangan 3" />
      </div>
      <figcaption class="caption">💖</figcaption>
    </figure>
    <figure class="photo-card">
      <div class="photo-frame">
        <img src="foto/WhatsApp Image 2026-11-22 at 18.44.40.jpeg" alt="Potret kenangan 3" />
      </div>
      <figcaption class="caption">💖</figcaption>
    </figure>
  </main>
</body>
</html>
